<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการสั่งซื้อ | Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้า admin */
    .page-head {
      padding: var(--space-5) 0 var(--space-4);
      text-align: center;
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line);
    }

    .page-head h1 {
      margin-bottom: 0;
      font-size: clamp(1.8rem, 3.6vw, 2.5rem);
    }

    .page-head .rule { margin: var(--space-3) auto 0; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    #ordersTable {
      width: 100%;
      min-width: 880px;
      border-collapse: collapse;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line);
    }

    #ordersTable thead th {
      font-weight: 400;
      font-size: 0.88rem;
      white-space: nowrap;
      color: var(--ink-soft);
      background: var(--bg-soft);
      border-bottom: 1px solid var(--line-strong);
    }

    #ordersTable tbody tr:last-child td { border-bottom: 0; }
    #ordersTable tbody tr:hover td { background: var(--bg); }

    /* วันเวลา และจำนวนเงิน ไม่ตัดบรรทัด */
    #ordersTable td:nth-child(1),
    #ordersTable td:nth-child(5) { white-space: nowrap; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1>รายการสั่งซื้อ</h1>
        <span class="rule" aria-hidden="true"></span>
      </div>
    </section>

    <section class="section" style="padding-top: var(--space-5);">
      <div class="container">
        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
